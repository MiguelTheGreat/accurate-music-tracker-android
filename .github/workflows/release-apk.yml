name: Build and Attach Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the debug APK to'
        required: true
        default: 'v0.1.0-preview'
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach-apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore (if configured)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="${TAG#v}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; falling back to ephemeral debug signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionCode=${{ steps.signing.outputs.version_code }} \
            -PappVersionName=${{ steps.signing.outputs.version_name }}
          cp app/build/outputs/apk/release/app-release.apk "accurate-music-tracker-${TAG}.apk"
          ls -lh "accurate-music-tracker-${TAG}.apk"

      - name: Build debug APK (fallback)
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -PappVersionCode=${{ steps.signing.outputs.version_code }} \
            -PappVersionName=${{ steps.signing.outputs.version_name }}
          cp app/build/outputs/apk/debug/app-debug.apk "accurate-music-tracker-${TAG}-debug.apk"
          ls -lh "accurate-music-tracker-${TAG}-debug.apk"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gh release upload "$TAG" "accurate-music-tracker-${TAG}.apk" --clobber
          else
            gh release upload "$TAG" "accurate-music-tracker-${TAG}-debug.apk" --clobber
          fi
